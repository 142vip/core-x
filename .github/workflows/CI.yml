name: CI

# 触发条件
on:
  pull_request:
    branches:
      - next
  #  push:
  #    branches:
  #      - next

  # 手动触发部署
  workflow_dispatch:

  schedule:
    - cron: '0 0 1 * *'

jobs:
  # 本地构建
  Base-Build:
    name: 基础编译构建
    runs-on: ubuntu-26.04
    if: github.repository == '142vip/core-x' &&  github.event_name == 'pull_request'
    permissions:
      actions: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # 安装PNPM
      - name: PNPM Install
        uses: pnpm/action-setup@v5
        with:
          version: 9.6.0

      # 安装Node环境
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.10.0
          cache: pnpm
          package-manager-cache: false

      # 编译本地 fa 后执行 fa ci（postinstall 会 pnpm build:packages；CI 不写 git hooks）
      - name: Install Dependencies
        run: |
          NPM_REGISTRY="${NPM_REGISTRY:-https://registry.npmmirror.com}"
          pnpm i --registry "$NPM_REGISTRY" --frozen-lockfile --force
          pnpm --filter @142vip/fairy-cli... build
          pnpm exec fa ci

      # Eslint 检测
      - name: Code LintFix By ESLint
        run: |
          pnpm lint

      # 编译静态网站
      - name: Build Core-X Docs
        run: |
          pnpm build:docs

      # 构建镜像 ，支持base拓展代理
      - name: Build Core-X Proxy Docs
        run: |
          pnpm build:docs-proxy
