name: CI

# 触发条件
on:
  pull_request:
    branches:
      - next
  #  push:
  #    branches:
  #      - next

  # 手动触发部署
  workflow_dispatch:

  schedule:
    - cron: '0 0 1 * *'

jobs:
  # 本地构建
  Base-Build:
    name: 基础编译构建
    runs-on: ubuntu-26.04
    if: github.repository == '142vip/core-x' &&  github.event_name == 'pull_request'
    permissions:
      actions: read
      pull-requests: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # 安装PNPM
      - name: PNPM Install
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      # 安装Node环境
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.10.0
          cache: pnpm
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile --force

      # Eslint（fairy 默认脚本，不写进根 package.json）
      - name: Code LintFix By ESLint
        run: npx fa lint

      # 单测（Turbo：先 ^build 再各包 jest，包间并行、互不写盘冲突）
      - name: Unit Tests
        run: |
          pnpm test

      #      - name: Unit Tests Coverage
      #        run: |
      #          pnpm test:coverage

      # 编译静态网站
      - name: Build Core-X Docs
        run: |
          pnpm build:docs

      # 构建镜像 ，支持base拓展代理
      - name: Build Core-X Proxy Docs
        run: |
          pnpm build:docs-proxy
